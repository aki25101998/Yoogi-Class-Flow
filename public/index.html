<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hệ thống quản lý chấm công và tính lương cho huấn luyện viên">
  <meta name="theme-color" content="#0f0f1a">
  <title>Quản Lý Chấm Công HLV</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- App content will be rendered here by JS -->
    <div class="loading-screen" id="loadingScreen">
      <div class="loading-spinner">
        <div class="spinner-ring"></div>
        <div class="spinner-ring"></div>
        <div class="spinner-ring"></div>
      </div>
      <p class="loading-text">Đang tải...</p>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Modal container -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal" id="modalContent">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle"></h3>
        <button class="modal-close" id="modalClose" aria-label="Đóng">
          <span class="material-icons-round">close</span>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';
    import { getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, query, where, orderBy, Timestamp, writeBatch, setDoc, collectionGroup } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js';
    
    // Make Firebase available globally
    window.firebase = {
      initializeApp, getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
      getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, 
      query, where, orderBy, Timestamp, writeBatch, setDoc, collectionGroup
    };

    // Load app after Firebase is ready (with cache busting)
    import('./js/app.js?v=' + Date.now()).catch(e => alert('Import error: ' + (e.stack || e)));
    console.log("Import initiated");
  </script>
</body>
</html>
